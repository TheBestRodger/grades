services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "6432:5432"
    volumes:
      - grades_mgtu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: grades-mgtu-mvp:latest
    ports:
      - "8010:8000"
    env_file:
      - .env
    volumes:
      - grades_mgtu_data:/app/backend/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 35s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=5).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: grades-mgtu-migrate:latest
    command: ["python", "-m", "app.migrate"]
    env_file:
      - .env
    volumes:
      - grades_mgtu_data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      FRONTEND_API_PROXY_TARGET: http://app:8000
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  grades_mgtu_postgres_data:
  grades_mgtu_data:
