services:
  app:
    build:
      context: .
    image: grades-mgtu-mvp:latest
    ports:
      - "${APP_PORT:-8010}:8000"
    environment:
      APP_ENV: "${APP_ENV:-pilot}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://192.168.18.163:8010}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-}"
      SMTP_USE_TLS: "${SMTP_USE_TLS:-true}"
      SMTP_USE_SSL: "${SMTP_USE_SSL:-false}"
      BOOTSTRAP_HR_USERNAME: "${BOOTSTRAP_HR_USERNAME:-}"
      BOOTSTRAP_HR_PASSWORD: "${BOOTSTRAP_HR_PASSWORD:-}"
      AUTO_IMPORT_GRADES_DOCUMENTS: "${AUTO_IMPORT_GRADES_DOCUMENTS:-true}"
      AI_MODE: "${AI_MODE:-off}"
      AI_PROVIDER: "${AI_PROVIDER:-off}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      AI_REQUEST_TIMEOUT_SECONDS: "${AI_REQUEST_TIMEOUT_SECONDS:-60}"
      PROFILER_DATA_DIR: /app/backend/data
      DATABASE_URL: "${DATABASE_URL:-sqlite:////app/backend/data/demo.sqlite}"
    volumes:
      - grades_mgtu_data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  grades_mgtu_data:
